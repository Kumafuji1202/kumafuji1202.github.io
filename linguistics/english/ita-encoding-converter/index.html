<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../../../css-global/global.css" />
  <link rel="stylesheet" href="main.css" />
  <meta name="author" content="Kumafuji1202" />
  <meta name="twitter:url" content="https://kumafuji1202.github.io/linguistics/english/ita-encoding-converter/" />
  <meta name="keywords" content="Initial Teaching Alphabet" />
  <link rel="canonical" href="https://kumafuji1202.github.io/linguistics/english/ita-encoding-converter/" />
  <title>Initial Teaching Alphabet encoding converter</title>
  <script src="../../../js-global/utils.js"></script>
  <script src="../../../js-global/utf16-string.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
 </head>
 <body>
  <div id="container">
   <div id="head">
    <h1>Initial Teaching Alphabet encoding converter</h1>
    <small>version 1.4.3, last updated <time datetime="2026-11-12">2026 Nov 13th</time></small>
    <label>
     Convert from:
     <select id="originsystem"></select>
    </label>
    <label
     >to:
     <select id="destsystem"></select> </label
    ><br />
    <button id="toClipboard">Copy text</button>
    <h2 id="options-head"><label for="show-options" id="options-label">options</label></h2>
    <form id="optionform">
     <input id="show-options" type="checkbox" />
     <ul>
      <li>
       Enclose capitals in non-PitmanITA encoding with: <input type="text" id="startcaps" value="{" />~<input
        type="text"
        id="endcaps"
        value="}" />
      </li>
      <li>
       <label>
        When converting to Phonemics’ encoding, replace “half a”-’s with:
        <select id="bath">
         <option value="trap">two-storey A’s</option>
         <option value="palm">one-storey A’s</option>
        </select>
       </label>
      </li>
      <li>
       <label>
        In the output, the codepoint for the letter <i>gay</i> is:
        <select id="gay">
         <option value="u0067">U+0067 LATIN SMALL LETTER G (g)</option>
         <option id="opt-scriptg" value="u0261">U+0261 LATIN SMALL LETTER SCRIPT G (ɡ)</option>
        </select>
       </label>
      </li>
      <li>
       <label>
        In the output, the codepoint for the letter <i>did</i> is:
        <select id="did">
         <option id="opt-d" value="u0064">U+0064 LATIN SMALL LETTER D (d)</option>
         <option id="opt-dtail" value="u0256">U+0256 LATIN SMALL LETTER D WITH TAIL (ɖ)</option>
         <option id="opt-dedic" value="dedic" disabled>(Use encoding’s dedicated codepoint)</option>
        </select>
       </label>
      </li>
      <li>
       <label>
        <input type="checkbox" id="uAB3C" /> In the Unicode 18.0 encoding, use U+AB3C LATIN SMALL LETTER ENG WITH
        CROSSED-TAIL as the letter <i>ing</i></label
       >
      </li>
     </ul>
    </form>
    <p>
     <a href="../../../">Back</a> / <a href="about.html" target="_blank">What is this?</a> /
     <a href="table.html" target="_blank">See encoding correspondence table</a> /
     <a href="changelogs.html" target="_blank">See changelog</a>
    </p>
   </div>
   <div id="io">
    <textarea id="input" placeholder="input some ITA text here..." spellcheck="false"></textarea>
    <div id="output"></div>
   </div>
  </div>
 </body>
</html>
